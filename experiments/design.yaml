# THE factor grid. Nothing else may hard-code profile/disruption/background/seed lists.
#
# The proposal fixes the TOTALS (216 main, 48 pilot, 18 extra). The 6 profiles (autopilot x GS x
# payload combinations) are not yet defined; only the first two exist for the PoC.
#   main : 6 profiles x 3 disruptions x 3 backgrounds x 4 seeds = 216
#   pilot: 6 profiles x 2 disruptions x 2 backgrounds x 2 seeds = 48   (assumption)
#
# Pilot seeds are disjoint from main seeds on purpose: decisions tuned on pilot data must not be
# evaluated on the same randomness.

phases:
  pilot:
    factors:
      profile: [px4_pymavlink, ardupilot_pymavlink, profile_c, profile_d, profile_e, profile_f]
      disruption: [link_loss, congestion]
      radio_background: [low, high]
      seed: {base: 9000, count: 2}

  main:
    factors:
      profile: [px4_pymavlink, ardupilot_pymavlink, profile_c, profile_d, profile_e, profile_f]
      disruption: [link_loss, congestion, weak_radio]
      radio_background: [low, medium, high]
      seed: {base: 1000, count: 4}

  # 18 extra runs planned in the proposal; purpose not specified there. Candidate: H4 runs with
  # equalised failsafe timeouts (6 profiles x link_loss x 1 background x 3 seeds). Undecided.
  extra:
    factors: null
