# Stage 2 (docs/poc-plan.md): C2 traffic through plain INET via the socket bridge.
# Real-side ports are NOT set here: the harness passes them per run on the command line
# (sim/smoke/sitl.py), so a missing value is an error rather than a silent default.

[General]
network = linkloss.omnetpp.C2Inet
scheduler-class = "inet::RealTimeScheduler"
cmdenv-express-mode = true
cmdenv-status-frequency = 10s
sim-time-limit = 3600s            # safety net; the harness stops the run with SIGINT
output-scalar-file = ${resultdir}/c2.sca
output-vector-file = ${resultdir}/c2.vec
**.app[*].*.vector-recording = true
**.vector-recording = false

*.linkDelay = 1ms
*.linkDatarate = 100Mbps

# GCS side: real socket on an ephemeral port, sends to the GCS's listening port (harness).
*.gcs.numApps = 1
*.gcs.app[0].typename = "linkloss.bridge.UdpSocketBridge"
*.gcs.app[0].localPort = 5000
*.gcs.app[0].destAddress = "uav"
*.gcs.app[0].destPort = 5000
*.gcs.app[0].realBindPort = 0

# Vehicle side: real socket on the port the flight stack sends to (harness); peer learned.
*.uav.numApps = 1
*.uav.app[0].typename = "linkloss.bridge.UdpSocketBridge"
*.uav.app[0].localPort = 5000
*.uav.app[0].destAddress = "gcs"
*.uav.app[0].destPort = 5000
*.uav.app[0].realPeerPort = -1

# Real checksums: the pcap recorder cannot serialize declared (unchecked) FCS/CRC values.
**.fcsMode = "computed"
**.crcMode = "computed"

# Simulator-side capture of the C2 traffic (L2/L3 headers are INET's, see ADR 0003).
*.uav.numPcapRecorders = 1
*.uav.pcapRecorder[0].pcapFile = "${resultdir}/c2.pcap"
*.uav.pcapRecorder[0].fileFormat = "pcap"
